name: Release

# 推 `v*` tag → 自动构建并挂到该 tag 的 Release，共 7 个资产：
#   qxync-<版本>-x86_64-unknown-linux-gnu.tar.gz        （三个二进制 + 桌面项/图标/许可证/文档）
#   qxync-bin-<版本>-1-x86_64.pkg.tar.zst                （Arch：真 makepkg 打，并逐项校验内容）
#   qxync_<版本>-1_amd64.deb                             （Debian 12+ / Ubuntu 22.04+ 通用 amd64）
#     └ 从**同一份** tar.gz 重打包（不重新编译，二进制与 tar.gz 里逐字节同源），
#       并在干净容器矩阵里 `apt-get install` 实装、逐项断言通过才发：
#       debian:12 / debian:13 / ubuntu:22.04 / ubuntu:24.04 / ubuntu:26.04。
#       只出一个包、却验五个发行版，是因为 Depends 以 ubuntu:22.04 的库（glibc 2.35 基线）
#       为下限计算；更新的发行版把 GTK 3 等改名为 t64 包并 `Provides` 旧名，
#       旧名依赖照样满足，所以同一个包能覆盖两个家族的新旧两端（详见实装校验步骤的注释）。
#   qxync / qxyncd / qxync-gui（三个裸二进制）
#   SHA256SUMS
# 手动重跑同一个 tag：Actions → Release → Run workflow，填 tag；同名资产会被覆盖，
# 不会重复建 Release。Release 正文优先用 `docs/发布说明-<tag>.md`（存在时），
# 否则用 GitHub 自动生成的 Release Notes。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/重跑的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # tag 是唯一真值：push 事件取 ref（就是 tag 本身），手动跑取输入。
  TAG: ${{ inputs.tag || github.ref_name }}
  # .deb 构建 / 实装矩阵校验时容器内的 apt 源。维护者在国内，镜像站在国内直连更快、
  # 也更稳；这是**唯一出处**：每条 docker 命令都用 `--env QXNYC_APT_MIRROR="${APT_MIRROR:-}"`
  # 传给容器，xtask/release/apt-mirror.sh 按 os-release 在后面接 /debian 或 /ubuntu。
  # 海外 runner 或镜像不可用时改这里（或直接设空——apt-mirror.sh 会回落到自带的清华默认值）：
  #   Debian → http://deb.debian.org         Ubuntu → http://archive.ubuntu.com
  APT_MIRROR: http://mirrors.tuna.tsinghua.edu.cn

# 发版不取消进行中的跑批：宁可排队，也不要留下「产物传了一半」的 Release。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: build + publish (ubuntu-22.04 · x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: 检出（tag 指向的提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # 与 CI 的依赖表保持一致；GUI 要 WebKitGTK 4.1 / GTK 3 才编得出来。
      # libarchive-tools 是为了 bsdtar —— 后面要读 Arch 包里的 .PKGINFO / 文件清单。
      - name: 安装系统依赖（FUSE3 + WebKitGTK/GTK3）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libarchive-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tag / Cargo.toml(workspace) / tauri.conf.json 三处版本必须一致，否则拒绝发版。
      - name: 版本一致性守卫
        run: python3 xtask/release/check-version.py "$TAG"

      # 三个二进制一次构建出来（GUI 与 CLI/daemon 共用同一份 release profile）。
      # 这里**不重复跑测试**：测试闸门是 ci.yml —— tag 应当打在 master 上已绿的提交
      # （发版清单 §3 的自查步骤也是这么要求的）。
      # 有意**不 strip**：release profile 带 line-tables-only 调试信息，
      # 用户报 bug 时贴出来的回溯才可读（见 Cargo.toml 的 [profile.release] 注释）。
      - name: cargo build --release --locked（qxync / qxyncd / qxync-gui）
        run: cargo build --release --locked -p qxync-cli -p qxync-daemon -p qxync-gui

      - name: 打包为 tar.gz + 裸二进制（输出到 dist/）
        run: |
          bash xtask/release/package-linux.sh "${TAG#v}" x86_64-unknown-linux-gnu
          ls -l dist

      # Arch 包：用 Arch 官方镜像里的**真 makepkg** 打（与用户 / AUR 同一套工具），
      # 源就是上一步刚打出来的 tar.gz —— 包里的二进制与 Release 资产完全同源。
      # 这一步失败就整体不发：宁可修好重跑，也不要发一个「说好带 Arch 包却没有」的 Release。
      - name: 打 Arch 包（archlinux:base-devel 容器里的真 makepkg）
        run: |
          set -euo pipefail
          # PKGBUILD 的 sha256sums 是占位值（提交代码时 Release 产物还不存在），这里换成真实值。
          tarball="dist/qxync-${TAG#v}-x86_64-unknown-linux-gnu.tar.gz"
          sum="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/arch/PKGBUILD

          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --env HOME=/home/qxync-builder \
            --env PACKAGER="Kami <mlzxgzy@gmail.com>" \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              # makepkg 不允许以 root 跑；建一个与 runner **同 uid** 的用户，
              # 这样它能在挂进来的 /work 里直接读写（宿主目录属主就是 runner）。
              getent group "$HOST_GID" >/dev/null || groupadd --gid "$HOST_GID" qxync-builder
              useradd --create-home --uid "$HOST_UID" --gid "$HOST_GID" --shell /bin/bash qxync-builder

              # fakeroot 在 base-devel 里；zstd 是 pacman → libarchive 的依赖，镜像里一定有。
              # 显式确认一遍：缺了就响亮地失败，而不是打出一个坏包。
              command -v makepkg fakeroot zstd

              # --nodeps：容器只负责打包，运行期依赖是给装机用户解的；
              # SRCDEST 指到 /work/dist：makepkg 直接复用刚打出来的 tar.gz，不下载（全程离线）。
              su qxync-builder -s /bin/bash -c "cd /work/packaging/arch && SRCDEST=/work/dist PKGDEST=/work/dist makepkg -f --nodeps"
            '
          ls -l dist/*.pkg.tar.zst

      - name: 校验 Arch 包内容
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(ls dist/*.pkg.tar.zst)
          [ "${#pkgs[@]}" -eq 1 ] || { echo "❌ 期望恰好一个 .pkg.tar.zst，实际 ${#pkgs[@]} 个"; exit 1; }
          # 版本号以 PKGBUILD 为准（pkgrel 变了也不用改这里）
          want="$(bash -c 'set -e; source packaging/arch/PKGBUILD; printf "%s-%s" "$pkgver" "$pkgrel"')"
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -E "^(pkgname|pkgver|arch) = "
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -qx "pkgname = qxync-bin"
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -qx "pkgver = ${want}"
          for f in usr/bin/qxync usr/bin/qxyncd usr/bin/qxync-gui \
                   usr/share/applications/qxync.desktop \
                   usr/lib/systemd/user/qxyncd.service \
                   usr/lib/systemd/user/qxyncd@.service \
                   usr/share/icons/hicolor/512x512/apps/qxync.png; do
            bsdtar -tf "${pkgs[0]}" | grep -qx "$f" || { echo "❌ 包里缺 $f"; exit 1; }
          done
          # 包里的三个二进制必须与 Release 资产**逐字节一致**（同一个 tar.gz 装出来的）
          for b in qxync qxyncd qxync-gui; do
            in_pkg="$(bsdtar -xOf "${pkgs[0]}" "usr/bin/$b" | sha256sum | cut -d' ' -f1)"
            on_disk="$(sha256sum "dist/$b" | cut -d' ' -f1)"
            [ "$in_pkg" = "$on_disk" ] || { echo "❌ 包里的 $b 与 dist/$b 不一致"; exit 1; }
          done
          echo "✅ Arch 包内容检查通过（${pkgs[0]}）"

      # ── Debian / Ubuntu .deb（单包）────────────────────────────────────────
      # 与 Arch 包同一个来源：把上一步的 tar.gz 解包后重打包（**不重新编译**），
      # 所以三个二进制与 tar.gz / Arch 包里的**逐字节同源**（由 package-deb.sh 保证）。
      # 只出一个包，版本串不带发行版后缀（`<版本>-1`）：Depends 在 ubuntu:22.04 里用
      # dpkg-shlibdeps 对三个二进制实测（glibc 2.35 是基线）、再手工补 fuse3。
      # 合并的理由是实测结论：以前 `~deb12` / `~ubuntu22.04` 两个包除 Version 与
      # changelog 那一行外**逐字节相同**，Depends 串也完全相同 —— 分两个包只会让用户
      # 选错（同包名装一个就够了），所以合成一个、改为在五个发行版里**实装验证**它。
      # 容器里先切国内镜像（apt-mirror.sh 用 QXNYC_APT_MIRROR，见文件头 env 注释），
      # 否则每次构建都要从境外源拉 libwebkit2gtk 等几十个包，慢且容易超时。
      # 打包容器里会被装上 dpkg-dev / 运行库；所以「装得上」由后面单独起干净容器来证明。
      - name: 打 .deb（ubuntu:22.04 容器 + 国内镜像，单包通用）
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env VERSION="${TAG#v}" \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --env QXNYC_APT_MIRROR="${APT_MIRROR:-}" \
            ubuntu:22.04 \
            bash -lc 'set -euo pipefail; bash xtask/release/apt-mirror.sh && bash xtask/release/package-deb.sh "$VERSION"'
          ls -l dist/*.deb

      # 打得出包 ≠ 装得上：另起**干净**容器，走用户真实路径
      # `apt-get install -y ./dist/<deb>`（依赖由该发行版自己的源解析），再逐项断言。
      # 刻意不复用上面的打包容器 —— 那里已经装了 dpkg-dev 和一堆运行库，
      # 在那里面装成功证明不了「用户从零也能装」。任一条断言失败即中断发版。
      #
      # 为什么一个包要验五个发行版：单包的 Depends 下限是按 ubuntu:22.04 算的，要证明
      # 「一个包覆盖两个发行版家族的新旧两端」，就得把两端都真装一遍 ——
      #   * 旧端 debian:12（glibc 2.36）/ ubuntu:22.04（2.35）：Depends 下限本身；
      #   * 新端 debian:13 / ubuntu:24.04 / ubuntu:26.04：风险点是 **t64 改名**
      #     （Debian 13 / Ubuntu 24.04+ 把 libgtk-3-0、libgdk-pixbuf-2.0-0、
      #     libwebkit2gtk-4.1-0 等改成 `*t64` 包，靠 `Provides: <旧名> (= <版本>)`
      #     满足旧名依赖）。这正是「不加两个包、但要加验证目标」的原因：
      #     包不变，变的是证明它在新发行版上装得上。
      - name: 实装校验 .deb（干净容器矩阵：debian:12/13、ubuntu:22.04/24.04/26.04）
        run: |
          set -euo pipefail
          version="${TAG#v}"
          want_version="${version}-1"
          deb="qxync_${want_version}_amd64.deb"
          [ -f "dist/$deb" ] || { echo "❌ 找不到 dist/$deb（打包步骤没产出？）"; ls -l dist/*.deb || true; exit 1; }
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 ubuntu:26.04; do
            echo "══ 实装校验：$image ← dist/$deb ══"
            docker run --rm --interactive \
              --volume "$PWD:/work" \
              --workdir /work \
              --env DEBIAN_FRONTEND=noninteractive \
              --env QXNYC_APT_MIRROR="${APT_MIRROR:-}" \
              --env DEB_PATH="$deb" \
              --env WANT_VERSION="$want_version" \
              "$image" \
              bash -s <<'INSTALL_CHECK' || { echo "❌ $image 实装校验失败（容器退出码非 0）"; exit 1; }
          set -euo pipefail

          echo "→ 切国内 apt 镜像"
          bash xtask/release/apt-mirror.sh
          apt-get update

          echo "→ apt-get install -y ./dist/$DEB_PATH（依赖由本发行版自己的源解析）"
          apt-get install -y "./dist/$DEB_PATH"

          echo "→ qxync --version / qxyncd --version"
          qxync --version
          qxyncd --version

          echo "→ qxync-gui --self-test：无 daemon 时退出码非 0 属正常，但必须真的跑起来并打印 JSON"
          gui_out="$(qxync-gui --self-test 2>&1 || true)"
          printf '%s\n' "$gui_out"
          [ -n "$gui_out" ] || { echo "❌ qxync-gui --self-test 没有任何输出"; exit 1; }
          printf '%s' "$gui_out" | grep -q '"ok"' || { echo "❌ qxync-gui --self-test 的输出不是预期的自检 JSON"; exit 1; }

          echo "→ ldd /usr/bin/qxync-gui 不应有 not found"
          missing="$(ldd /usr/bin/qxync-gui 2>&1 | grep -c "not found" || true)"
          [ "$missing" -eq 0 ] || { echo "❌ qxync-gui 有 $missing 个动态库 missing："; ldd /usr/bin/qxync-gui 2>&1 | grep "not found"; exit 1; }

          echo "→ dpkg -L qxync 关键文件"
          for f in /usr/bin/qxync /usr/bin/qxyncd /usr/bin/qxync-gui \
                   /usr/share/applications/qxync.desktop \
                   /usr/lib/systemd/user/qxyncd.service \
                   /usr/lib/systemd/user/qxyncd@.service; do
            dpkg -L qxync | grep -qxF "$f" || { echo "❌ dpkg -L qxync 里没有 $f"; exit 1; }
          done

          echo "→ dpkg -s qxync 版本串（单包：不论哪个发行版，Version 都应是 <版本>-1）"
          installed="$(dpkg -s qxync | awk '/^Version:/ { print $2 }')"
          [ "$installed" = "$WANT_VERSION" ] || { echo "❌ 已装版本 $installed，期望 $WANT_VERSION"; exit 1; }

          echo "✅ $DEB_PATH 实装校验通过"
          INSTALL_CHECK
            echo "✅ $image 实装校验通过（$deb）"
          done

      - name: 生成 SHA256SUMS
        run: |
          # 只算 dist/ **顶层**的普通文件、按名字排序：
          #   * 先删旧的 —— 重跑时 `*` 会把上一轮的 SHA256SUMS 自己也算进去；
          #   * `-maxdepth 1 -type f` —— 本地复跑时 dist/ 下可能有子目录
          #     （例如构建 Arch 包的 dist/arch/），`*` 会去 hash 目录并直接报错。
          cd dist && rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # 先留档到 Actions artifacts：万一后面的 Release 步骤失败，产物还能从这次 run 里取回。
      - name: 留档到 Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qxync-${{ inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: 选 Release 正文（docs/发布说明-<tag>.md 存在就用它）
        id: notes
        run: |
          body="docs/发布说明-${TAG}.md"
          if [ -f "$body" ]; then
            echo "body_path=$body" >> "$GITHUB_OUTPUT"
            echo "用正文文件：$body"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "没有 $body，改用 GitHub 自动生成的 Release Notes"
          fi

      - name: 发布 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: qxync ${{ inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
