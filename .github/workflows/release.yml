name: Release

# 推 `v*` tag → 自动构建三个二进制并挂到该 tag 的 Release：
#   qxync / qxyncd / qxync-gui（三个裸二进制 + 一个 tar.gz）+ SHA256SUMS
# 手动重跑同一个 tag：Actions → Release → Run workflow，填 tag；同名资产会被覆盖，
# 不会重复建 Release。Release 正文优先用 `docs/发布说明-<tag>.md`（存在时），
# 否则用 GitHub 自动生成的 Release Notes。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/重跑的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # tag 是唯一真值：push 事件取 ref（就是 tag 本身），手动跑取输入。
  TAG: ${{ inputs.tag || github.ref_name }}

# 发版不取消进行中的跑批：宁可排队，也不要留下「产物传了一半」的 Release。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: build + publish (ubuntu-22.04 · x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: 检出（tag 指向的提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # 与 CI 的依赖表保持一致；GUI 要 WebKitGTK 4.1 / GTK 3 才编得出来。
      # libarchive-tools 是为了 bsdtar —— 后面要读 Arch 包里的 .PKGINFO / 文件清单。
      - name: 安装系统依赖（FUSE3 + WebKitGTK/GTK3）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libarchive-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tag / Cargo.toml(workspace) / tauri.conf.json 三处版本必须一致，否则拒绝发版。
      - name: 版本一致性守卫
        run: python3 xtask/release/check-version.py "$TAG"

      # 三个二进制一次构建出来（GUI 与 CLI/daemon 共用同一份 release profile）。
      # 这里**不重复跑测试**：测试闸门是 ci.yml —— tag 应当打在 master 上已绿的提交
      # （发版清单 §3 的自查步骤也是这么要求的）。
      # 有意**不 strip**：release profile 带 line-tables-only 调试信息，
      # 用户报 bug 时贴出来的回溯才可读（见 Cargo.toml 的 [profile.release] 注释）。
      - name: cargo build --release --locked（qxync / qxyncd / qxync-gui）
        run: cargo build --release --locked -p qxync-cli -p qxync-daemon -p qxync-gui

      - name: 打包为 tar.gz + 裸二进制（输出到 dist/）
        run: |
          bash xtask/release/package-linux.sh "${TAG#v}" x86_64-unknown-linux-gnu
          ls -l dist

      # Arch 包：用 Arch 官方镜像里的**真 makepkg** 打（与用户 / AUR 同一套工具），
      # 源就是上一步刚打出来的 tar.gz —— 包里的二进制与 Release 资产完全同源。
      # 这一步失败就整体不发：宁可修好重跑，也不要发一个「说好带 Arch 包却没有」的 Release。
      - name: 打 Arch 包（archlinux:base-devel 容器里的真 makepkg）
        run: |
          set -euo pipefail
          # PKGBUILD 的 sha256sums 是占位值（提交代码时 Release 产物还不存在），这里换成真实值。
          tarball="dist/qxync-${TAG#v}-x86_64-unknown-linux-gnu.tar.gz"
          sum="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/arch/PKGBUILD

          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --env HOME=/home/qxync-builder \
            --env PACKAGER="Kami <mlzxgzy@gmail.com>" \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              # makepkg 不允许以 root 跑；建一个与 runner **同 uid** 的用户，
              # 这样它能在挂进来的 /work 里直接读写（宿主目录属主就是 runner）。
              getent group "$HOST_GID" >/dev/null || groupadd --gid "$HOST_GID" qxync-builder
              useradd --create-home --uid "$HOST_UID" --gid "$HOST_GID" --shell /bin/bash qxync-builder

              # fakeroot 在 base-devel 里；zstd 是 pacman → libarchive 的依赖，镜像里一定有。
              # 显式确认一遍：缺了就响亮地失败，而不是打出一个坏包。
              command -v makepkg fakeroot zstd

              # --nodeps：容器只负责打包，运行期依赖是给装机用户解的；
              # SRCDEST 指到 /work/dist：makepkg 直接复用刚打出来的 tar.gz，不下载（全程离线）。
              su qxync-builder -s /bin/bash -c "cd /work/packaging/arch && SRCDEST=/work/dist PKGDEST=/work/dist makepkg -f --nodeps"
            '
          ls -l dist/*.pkg.tar.zst

      - name: 校验 Arch 包内容
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(ls dist/*.pkg.tar.zst)
          [ "${#pkgs[@]}" -eq 1 ] || { echo "❌ 期望恰好一个 .pkg.tar.zst，实际 ${#pkgs[@]} 个"; exit 1; }
          # 版本号以 PKGBUILD 为准（pkgrel 变了也不用改这里）
          want="$(bash -c 'set -e; source packaging/arch/PKGBUILD; printf "%s-%s" "$pkgver" "$pkgrel"')"
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -E "^(pkgname|pkgver|arch) = "
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -qx "pkgname = qxync-bin"
          bsdtar -xOf "${pkgs[0]}" .PKGINFO | grep -qx "pkgver = ${want}"
          for f in usr/bin/qxync usr/bin/qxyncd usr/bin/qxync-gui \
                   usr/share/applications/qxync.desktop \
                   usr/share/icons/hicolor/512x512/apps/qxync.png; do
            bsdtar -tf "${pkgs[0]}" | grep -qx "$f" || { echo "❌ 包里缺 $f"; exit 1; }
          done
          # 包里的三个二进制必须与 Release 资产**逐字节一致**（同一个 tar.gz 装出来的）
          for b in qxync qxyncd qxync-gui; do
            in_pkg="$(bsdtar -xOf "${pkgs[0]}" "usr/bin/$b" | sha256sum | cut -d' ' -f1)"
            on_disk="$(sha256sum "dist/$b" | cut -d' ' -f1)"
            [ "$in_pkg" = "$on_disk" ] || { echo "❌ 包里的 $b 与 dist/$b 不一致"; exit 1; }
          done
          echo "✅ Arch 包内容检查通过（${pkgs[0]}）"

      - name: 生成 SHA256SUMS
        run: |
          # 只算 dist/ **顶层**的普通文件、按名字排序：
          #   * 先删旧的 —— 重跑时 `*` 会把上一轮的 SHA256SUMS 自己也算进去；
          #   * `-maxdepth 1 -type f` —— 本地复跑时 dist/ 下可能有子目录
          #     （例如构建 Arch 包的 dist/arch/），`*` 会去 hash 目录并直接报错。
          cd dist && rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # 先留档到 Actions artifacts：万一后面的 Release 步骤失败，产物还能从这次 run 里取回。
      - name: 留档到 Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qxync-${{ inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: 选 Release 正文（docs/发布说明-<tag>.md 存在就用它）
        id: notes
        run: |
          body="docs/发布说明-${TAG}.md"
          if [ -f "$body" ]; then
            echo "body_path=$body" >> "$GITHUB_OUTPUT"
            echo "用正文文件：$body"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "没有 $body，改用 GitHub 自动生成的 Release Notes"
          fi

      - name: 发布 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: qxync ${{ inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
