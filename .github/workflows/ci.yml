name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧跑批直接取消，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- 构建 + 测试
  test:
    name: build + test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（FUSE3 + Tauri/GUI 的 WebKitGTK）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # --locked：Cargo.lock 已入库，构建必须严格按锁定的依赖版本走
      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # 真机测试必须保持 #[ignore]：它们是手动跑的，绝不能因为 CI 恰好有网就误连真实设备。
      # 这里把「ignored 用例数」钉死，谁把 #[ignore] 去掉就会在这里失败。
      # ⚠️ 增删真机用例时**必须同步改这个数字**，否则 CI 会红。
      #    现值 20 的构成（改动时请一并核对）：
      #      nas.rs 12 + get_meta.rs 3 + daemon_ipc.rs 1 + syncing_folders.rs 1 + versioning.rs 1
      #      + two_step.rs 2（M17 两步验证：TOTP 登录 / 缺第二因素报错）
      #    （v0.4.3 新增 nas.rs 的 m11_batch_delete_contract；
      #      v0.5.0 起 nas.rs 补齐 stream_upload_matches_bytes_upload / stream_upload_memory_stays_flat /
      #      write_api_contract / ranged_download_is_byte_stable 4 条；
      #      v0.6.2 新增 two_step.rs 的 m17_totp_login_roundtrip /
      #      m17_totp_missing_second_factor_is_reported 2 条）
      - name: 确认真机测试仍是 #[ignore]（应为 20 条）
        run: |
          n="$(cargo test -p qxync-proto-test -- --list --ignored | grep -cE ': test$')"
          echo "ignored tests = $n"
          [ "$n" = "20" ] || {
            echo "❌ 期望 20 条 ignored 真机测试，实际 $n 条"
            echo "   若确实增删了真机用例，请同步更新本步骤的数字与上面的构成说明"
            exit 1
          }

      # 只跑 clippy、不 -D warnings：本仓库尚未做告警清零，
      # 先把「编译级错误」挡住；收紧到 -D warnings 是后续独立的一步。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      # ★ M18：GUI 前端的**纯函数**单测（任务默认 id / 本地文件夹 / 水合缓存按连接与 id 派生）。
      # 不依赖浏览器、不连 NAS —— GitHub runner 自带 node，直接跑。
      # 无头浏览器集成（chromium + 打桩后端）仍在 xtask/tests/gui-task-defaults.sh 里手动跑。
      - name: node 前端纯函数单测（task-defaults）
        run: node xtask/tests/task-defaults.test.mjs

      # ★ M33：右下角下载进度卡片 —— 源文本级单测（抠 app.js 真实函数 + 假时钟/假 DOM），
      # 覆盖 3 秒静默期 / 10Hz 节流 / 滑窗速度 / 未知总量 / finish 语义。
      - name: node 前端源文本单测（M33 下载进度卡片）
        run: node xtask/tests/m33-dl-toast.test.mjs

      # ★ M19：删除相关数据（purge）的隔离 e2e —— 不需要 NAS / 不需要真窗口。
      # 覆盖任务级 / 连接级 / daemon 在跑（IPC）/ 全局四条路径，并断言
      # 「挂载点里的用户文件不会被动」这条安全底线。缺 sqlite3 时脚本会跳过行数断言。
      - name: M19 删除相关数据 e2e（隔离 XDG）
        run: bash xtask/tests/m19-purge.sh

      # ★ M20：离线缓冲区 / 离线状态的隔离 e2e —— NAS 指向 127.0.0.1:9（必定不可达），
      # 不需要真实设备。断言：离线时 status 不卡网络、如实显示离线、缓冲区计数可见、
      # 跨 daemon 重启行不丢且网络错误不消耗重试次数。缺 sqlite3 时跳过行数断言。
      - name: M20 离线状态 / 缓冲区 e2e（隔离 XDG）
        run: bash xtask/tests/m20-offline.sh

      # ★ M40：多路径连接（内网 / 公网 / DDNS）的隔离 e2e —— Python 假 NAS + 隔离 XDG。
      # 覆盖额外路径优先、失败自动切路、优先路径恢复自动切回、DDNS 主机名解析分类、
      # NAS 身份守卫（错误 NAS 被 blocked）、旧配置行为不变、全路径不可达离线、
      # daemon 不在时 `routes --probe` 直连回落。不需要真实 NAS / /dev/fuse。
      - name: M40 多路径 e2e（隔离 XDG）
        run: bash xtask/tests/m40-multipath.sh

      # ★ M21：离线可重启 daemon 的隔离 e2e —— 假 NAS（127.0.0.1:9）+ 真 FUSE 挂载。
      # 断言：离线启动后挂载点从 mounts.json + listings 表恢复、离线 ls / 写缓冲、
      # 第二次离线重启幂等。需要 /dev/fuse 与 python3，缺任一自动 SKIP。
      #
      # ★ v0.7.0 首跑抓到的坑（2026-10-20）：runner 的 /dev/fuse **是有的**（这步
      #   真跑了，不是 SKIP），但 stock /etc/fuse.conf 没有 `user_allow_other` ——
      #   脚本 fixture 的 mounts.json 忠实还原 task add 流程（auto_unmount=true），
      #   fuser 据此传 allow_other → fusermount3 拒绝非特权挂载 → 恢复挂载失败，
      #   9 条断言连锁挂。本地能过是因为开发机的 /etc/fuse.conf 已启用它。
      #   修法：跑之前把这行放开（runner 是 sudo 免密的）。
      - name: 启用 FUSE user_allow_other（auto_unmount 挂载需要）
        run: |
          sudo sed -i 's/^#user_allow_other$/user_allow_other/' /etc/fuse.conf || true
          grep -q '^user_allow_other' /etc/fuse.conf || echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
          grep '^user_allow_other' /etc/fuse.conf
      - name: M21 离线重启 e2e（隔离 XDG + 真 FUSE，无 /dev/fuse 时 SKIP）
        run: bash xtask/tests/m21-offline-restart.sh

  # ---------------------------------------------------------------- MSRV
  msrv:
    name: MSRV check (rust 1.90)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 声明值取自依赖图里**最高的那个 MSRV**（当前是 Tauri 2.12 栈的 1.90）；
      # 这里连 GUI 一起 check，所以要把 WebKitGTK 装上，否则量出来的不是真下限。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2

      # `rust-version` 只做「声明」用，Cargo 不会自动回退到 MSRV 兼容版本
      # （那是 resolver v3 的行为）。所以这条 job 是唯一能证明声明没撒谎的地方。
      - name: cargo check --workspace (rust-version = 1.90)
        run: cargo check --workspace --locked

      # 依赖声明了更高 MSRV 时，上面的 check 会直接失败 —— 这里额外把
      # 「依赖图里有没有超过声明值的包」显式打出来，方便定位。
      - name: 列出依赖图里 MSRV 高于声明值的包（应为空）
        run: |
          cargo metadata --format-version 1 \
            | python3 -c "
          import sys, json
          key = lambda v: tuple(int(x) for x in v.split('.'))
          m = json.load(sys.stdin)
          bad = sorted(
              ((p['rust_version'], p['name'], p['version'])
               for p in m['packages']
               if p.get('rust_version') and key(p['rust_version']) > (1, 90)),
              reverse=True)
          print(f'{len(bad)} 个包的 MSRV 高于 1.90')
          for rv, n, v in bad:
              print(f'  {rv:<8} {n} {v}')
          sys.exit(1 if bad else 0)
          "

  # ---------------------------------------------------------------- 格式
  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
