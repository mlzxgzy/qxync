name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧跑批直接取消，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- 构建 + 测试
  test:
    name: build + test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（FUSE3 + Tauri/GUI 的 WebKitGTK）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # --locked：Cargo.lock 已入库，构建必须严格按锁定的依赖版本走
      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # 真机测试必须保持 #[ignore]：它们是手动跑的，绝不能因为 CI 恰好有网就误连真实设备。
      # 这里把「ignored 用例数」钉死，谁把 #[ignore] 去掉就会在这里失败。
      # ⚠️ 增删真机用例时**必须同步改这个数字**，否则 CI 会红。
      #    现值 18 的构成（改动时请一并核对）：
      #      nas.rs 12 + get_meta.rs 3 + daemon_ipc.rs 1 + syncing_folders.rs 1 + versioning.rs 1
      #    （v0.4.3 新增 nas.rs 的 m11_batch_delete_contract；
      #      v0.5.0 起 nas.rs 补齐 stream_upload_matches_bytes_upload / stream_upload_memory_stays_flat /
      #      write_api_contract / ranged_download_is_byte_stable 4 条）
      - name: 确认真机测试仍是 #[ignore]（应为 18 条）
        run: |
          n="$(cargo test -p qxync-proto-test -- --list --ignored | grep -cE ': test$')"
          echo "ignored tests = $n"
          [ "$n" = "18" ] || {
            echo "❌ 期望 18 条 ignored 真机测试，实际 $n 条"
            echo "   若确实增删了真机用例，请同步更新本步骤的数字与上面的构成说明"
            exit 1
          }

      # 只跑 clippy、不 -D warnings：本仓库尚未做告警清零，
      # 先把「编译级错误」挡住；收紧到 -D warnings 是后续独立的一步。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

  # ---------------------------------------------------------------- MSRV
  msrv:
    name: MSRV check (rust 1.90)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 声明值取自依赖图里**最高的那个 MSRV**（当前是 Tauri 2.12 栈的 1.90）；
      # 这里连 GUI 一起 check，所以要把 WebKitGTK 装上，否则量出来的不是真下限。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            fuse3 libfuse3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2

      # `rust-version` 只做「声明」用，Cargo 不会自动回退到 MSRV 兼容版本
      # （那是 resolver v3 的行为）。所以这条 job 是唯一能证明声明没撒谎的地方。
      - name: cargo check --workspace (rust-version = 1.90)
        run: cargo check --workspace --locked

      # 依赖声明了更高 MSRV 时，上面的 check 会直接失败 —— 这里额外把
      # 「依赖图里有没有超过声明值的包」显式打出来，方便定位。
      - name: 列出依赖图里 MSRV 高于声明值的包（应为空）
        run: |
          cargo metadata --format-version 1 \
            | python3 -c "
          import sys, json
          key = lambda v: tuple(int(x) for x in v.split('.'))
          m = json.load(sys.stdin)
          bad = sorted(
              ((p['rust_version'], p['name'], p['version'])
               for p in m['packages']
               if p.get('rust_version') and key(p['rust_version']) > (1, 90)),
              reverse=True)
          print(f'{len(bad)} 个包的 MSRV 高于 1.90')
          for rv, n, v in bad:
              print(f'  {rv:<8} {n} {v}')
          sys.exit(1 if bad else 0)
          "

  # ---------------------------------------------------------------- 格式
  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
