[workspace]
resolver = "2"
members = [
    "crates/qxync-core",
    "crates/qxync-client",
    "crates/qxync-cli",
    "crates/qxync-fuse",
    "crates/qxync-daemon",
    "crates/qxync-gui",
    "crates/qxync-proto-test",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.90"

# 双许可：MIT 或 Apache-2.0 任选其一（Rust 生态惯例）。
# ⚠️ 该许可只覆盖本仓库的原创代码；被逆向分析的 QNAP 软件不在此列，见 DISCLAIMER.md。
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlzxgzy/qxync"
authors = ["Kami <mlzxgzy@gmail.com>"]
# keywords 描述的是「跟什么互通」，不是本项目的名字 —— 所以 `qsync` 保留
# （就像 `.desktop` 里的 `GenericName=QNAP Qsync client` 一样）。
keywords = ["qnap", "qsync", "qxync", "fuse", "on-demand"]
categories = ["command-line-utilities", "filesystem", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
    "stream",
] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 发版用 release profile。
# 注意：**故意不设** `panic = "abort"` —— daemon 与 FUSE 回调里的 panic 需要能展开成
# 带行号的回溯才好定位（本项目修过「挂载失败把 worker 打成 panic」那类问题）；
# `debug = "line-tables-only"` 就是为了让用户报 bug 时贴出来的回溯是可读的。
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
