[package]
name = "qxync-daemon"
description = "qxyncd daemon: FUSE + sync engine + local IPC server · qxyncd 常驻守护：FUSE + 同步引擎 + 本地 IPC 服务端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "qxyncd"
path = "src/main.rs"

[dependencies]
qxync-core = { path = "../qxync-core" }
qxync-client = { path = "../qxync-client" }
qxync-fuse = { path = "../qxync-fuse" }
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
# ★ WPS 保存修复：fuser 的诊断走 `log` crate，桥到 tracing 才能进日志
log = "0.4"
libc = "0.2"
