[package]
name = "qxync-core"
description = "Shared types: status codes, errors, path encoding, config layout · 共享类型：状态码、错误、路径/编码、配置布局、数据模型"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
# M8.4：statvfs（释放空间）。core 其它地方不直接用 libc。
libc = "0.2"
# M5 状态库（游标/baseline/pin）。`bundled` = 自带 SQLite 源码，不依赖系统 libsqlite3。
rusqlite = { version = "0.40", features = ["bundled"] }
# ★ M15/T9：file_id 与 T3 的 chunk 校验和共用同一个散列（seed=0 的 xxh64 必须保持不变）。
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
